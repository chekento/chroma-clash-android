name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: Colorsecrets
    env:
      CHROMA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.CHROMA_UPLOAD_KEYSTORE_BASE64 }}
      CHROMA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.CHROMA_UPLOAD_KEYSTORE_PASSWORD }}
      CHROMA_UPLOAD_KEY_ALIAS: ${{ secrets.CHROMA_UPLOAD_KEY_ALIAS }}
      CHROMA_UPLOAD_KEY_PASSWORD: ${{ secrets.CHROMA_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CHROMA_UPLOAD_KEYSTORE_BASE64 CHROMA_UPLOAD_KEYSTORE_PASSWORD CHROMA_UPLOAD_KEY_ALIAS CHROMA_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/chroma-clash-upload.jks"
          printf '%s' "$CHROMA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "CHROMA_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB signature
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: chroma-clash-play-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
